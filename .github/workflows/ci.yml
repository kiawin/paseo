name: CI
on:
  workflow_dispatch:
jobs:
  metadata-race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Exercise continuous reader
        shell: pwsh
        run: |
          cd packages/desktop
          1..3 | ForEach-Object {
            Write-Host "Baseline attempt $_"
            npx vitest run src/features/browser-recording/store.test.ts -t 'serializes concurrent metadata updates' --bail=1
            Write-Host "BASELINE_RESULT=$_ exit=$LASTEXITCODE"
          }
      - name: Exercise reader with a gap
        shell: pwsh
        run: |
          $test = 'packages/desktop/src/features/browser-recording/store.test.ts'
          $text = Get-Content -Raw $test
          $old = 'await new Promise((resolve) => setImmediate(resolve));'
          if (!$text.Contains($old)) { throw 'Reader statement not found' }
          $text = $text.Replace($old, 'await new Promise((resolve) => setTimeout(resolve, 25));')
          Set-Content -NoNewline $test $text
          cd packages/desktop
          1..3 | ForEach-Object {
            Write-Host "Reader-gap attempt $_"
            npx vitest run src/features/browser-recording/store.test.ts -t 'serializes concurrent metadata updates' --bail=1
            Write-Host "GAP_RESULT=$_ exit=$LASTEXITCODE"
          }
