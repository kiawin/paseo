name: CI
on:
  workflow_dispatch:
jobs:
  metadata-race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Exercise continuous reader
        shell: pwsh
        run: |
          cd packages/desktop
          1..12 | ForEach-Object {
            Write-Host "Baseline attempt $_"
            npx vitest run src/features/browser-recording/store.test.ts -t 'serializes concurrent metadata updates' --bail=1
            Write-Host "BASELINE_RESULT=$_ exit=$LASTEXITCODE"
          }
      - name: Exercise longer bounded retries
        shell: pwsh
        run: |
          $source = 'packages/desktop/src/features/browser-recording/atomic-rename.ts'
          $text = Get-Content -Raw $source
          $old = '[10, 25, 50, 100, 200]'
          if (!$text.Contains($old)) { throw 'Retry delays not found' }
          $text = $text.Replace($old, '[10, 25, 50, 100, 200, 400, 800, 1000, 1000]')
          [System.IO.File]::WriteAllText($source, $text)
          cd packages/desktop
          1..12 | ForEach-Object {
            Write-Host "Retry attempt $_"
            npx vitest run src/features/browser-recording/store.test.ts -t 'serializes concurrent metadata updates' --bail=1
            Write-Host "RETRY_RESULT=$_ exit=$LASTEXITCODE"
          }
      - name: Restore retry policy
        shell: pwsh
        run: git checkout -- packages/desktop/src/features/browser-recording/atomic-rename.ts
      - name: Exercise reader with a gap
        shell: pwsh
        run: |
          $test = 'packages/desktop/src/features/browser-recording/store.test.ts'
          $text = Get-Content -Raw $test
          $old = 'await new Promise((resolve) => setImmediate(resolve));'
          if (!$text.Contains($old)) { throw 'Reader statement not found' }
          $text = $text.Replace($old, 'await new Promise((resolve) => setTimeout(resolve, 25));')
          [System.IO.File]::WriteAllText($test, $text)
          cd packages/desktop
          1..12 | ForEach-Object {
            Write-Host "Reader-gap attempt $_"
            npx vitest run src/features/browser-recording/store.test.ts -t 'serializes concurrent metadata updates' --bail=1
            Write-Host "GAP_RESULT=$_ exit=$LASTEXITCODE"
          }
